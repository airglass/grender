            let currentTouchstartInstance, lastX, lastY;
            g.subscribe((event) => {
                if (event.type == "touchstart") {
                    const [currentInstance] =
                        mainRenderer.getElementsContainPoint(event);
                    if (currentInstance) {
                        currentTouchstartInstance = currentInstance;
                    }
                }
                if (event.type == "touchmove") {
                    if (currentTouchstartInstance) {
                        lastX = lastX || event.x;
                        lastY = lastY || event.y;
                        const offsetX = event.x - lastX || 0;
                        const offsetY = event.y - lastY || 0;
                        currentTouchstartInstance.x += offsetX;
                        currentTouchstartInstance.y += offsetY;
                        currentTouchstartInstance.updatePath();
                        lastX = event.x;
                        lastY = event.y;
                        console.log(event.x, event.y);
                    }
                }
                if (event.type == "touchend") {
                    currentTouchstartInstance = null;
                    lastX = lastY = null;
                }
            });
